# Frontend (build Vite → volume) + nginx (edge: estáticos + proxy /api).
# Uso: docker compose -f docker/docker-compose.yml up -d --build
services:
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: /api
        VITE_USE_DEMO_API: ${VITE_USE_DEMO_API:-true}
    volumes:
      - frontend_assets:/out
    restart: "no"

  nginx:
    build:
      context: ..
      dockerfile: docker/Dockerfile.nginx
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    environment:
      # URL da API acessível a partir do container (não use localhost do host)
      API_UPSTREAM: ${API_UPSTREAM:-http://host.docker.internal:8080}
    volumes:
      - frontend_assets:/usr/share/nginx/html:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      frontend:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  frontend_assets:
